# Worker `bit002` — histórico de runs em D1 (docs/04 §4).
# Deploy em https://bit002.daniel-queiroga.workers.dev
#
# O `database_id` fica em branco até alguém rodar `wrangler d1 create bit002`
# e colar o id aqui. Isso é a Etapa E9; até lá não há deploy.

name = "bit002"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "../web/dist"

[[d1_databases]]
binding = "DB"
database_name = "bit002"
database_id = ""            # preencher após `wrangler d1 create bit002`
migrations_dir = "migrations"
